---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: zonetrusts.security.poc.example
spec:
  group: security.poc.example
  names:
    kind: ZoneTrust
    listKind: ZoneTrustList
    plural: zonetrusts
    shortNames:
    - ztrust
    singular: zonetrust
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceZone
      name: Source
      type: string
    - jsonPath: .spec.destinationZone
      name: Destination
      type: string
    - jsonPath: .spec.allowed
      name: Allowed
      type: boolean
    - jsonPath: .status.applied
      name: Applied
      type: boolean
    - jsonPath: .status.backend
      name: Backend
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZoneTrustSpec describes one directional, authenticated gateway
              relationship.
            properties:
              allowed:
                type: boolean
              destinationZone:
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: destinationZone is immutable
                  rule: self == oldSelf
              sourceZone:
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: sourceZone is immutable
                  rule: self == oldSelf
            required:
            - allowed
            - destinationZone
            - sourceZone
            type: object
            x-kubernetes-validations:
            - message: sourceZone and destinationZone must differ
              rule: self.sourceZone != self.destinationZone
          status:
            description: ZoneTrustStatus reports the last generation made effective
              by the chosen backend.
            properties:
              applied:
                type: boolean
              backend:
                type: string
              lastTransitionTime:
                format: date-time
                type: string
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must equal <sourceZone>-to-<destinationZone>
          rule: self.metadata.name == self.spec.sourceZone + '-to-' + self.spec.destinationZone
    served: true
    storage: true
    subresources:
      status: {}
