apiVersion: v1
kind: ServiceAccount
metadata:
  name: zone-app
  namespace: zone-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-app
  namespace: zone-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zone-app
      security.poc.example/zone: zone-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zone-app
        app.kubernetes.io/component: app
        security.poc.example/zone: zone-a
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: zone-app
      containers:
        - name: app
          image: spire-gw-app:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: ZONE
              value: zone-a
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: zone-app
  namespace: zone-a
spec:
  selector:
    app.kubernetes.io/name: zone-app
    security.poc.example/zone: zone-a
  ports:
    - name: http
      port: 8080
      targetPort: http
