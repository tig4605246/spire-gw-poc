apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: zone-a
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-local-gateway-only
  namespace: zone-a
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: app
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: zone-gateway
              security.poc.example/zone: zone-a
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: zone-a
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: zone-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              security.poc.example/e2e: "true"
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              security.poc.example/zone: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/component: zone-gateway
      ports:
        - protocol: TCP
          port: 8443
---
