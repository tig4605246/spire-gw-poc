# Applied before any gateway is created. These bootstrap-owned policies retain
# the public call entrypoint independently from the controller-managed 8443
# policy. Consequently, deletion or reconciliation failure of the dynamic
# policy leaves an ALLOW policy selecting the gateway whose only match is 8080;
# Istio therefore continues to deny protected 8443 traffic.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: zone-trust-baseline
  namespace: zone-a
  labels:
    app.kubernetes.io/managed-by: zone-trust-bootstrap
    security.poc.example/destination-zone: zone-a
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: zone-gateway
      security.poc.example/zone: zone-a
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ["8080"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: zone-trust-baseline
  namespace: zone-b
  labels:
    app.kubernetes.io/managed-by: zone-trust-bootstrap
    security.poc.example/destination-zone: zone-b
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: zone-gateway
      security.poc.example/zone: zone-b
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ["8080"]
