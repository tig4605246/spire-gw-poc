apiVersion: v1
kind: ServiceAccount
metadata:
  name: zone-gateway
  namespace: zone-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-gateway
  namespace: zone-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: zone-gateway
      security.poc.example/zone: zone-a
  template:
    metadata:
      labels:
        app.kubernetes.io/component: zone-gateway
        app.kubernetes.io/name: zone-gateway
        security.poc.example/zone: zone-a
        spiffe.io/spire-managed-identity: "true"
      annotations:
        sidecar.istio.io/inject: "true"
        inject.istio.io/templates: gateway,spire
    spec:
      serviceAccountName: zone-gateway
      nodeSelector:
        security.poc.example/gateway-zone: zone-a
      containers:
        # The gateway injector replaces image:auto with the pinned proxy image.
        - name: istio-proxy
          image: auto
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mtls, containerPort: 8443 }
---
apiVersion: v1
kind: Service
metadata:
  name: zone-gateway
  namespace: zone-a
spec:
  selector:
    app.kubernetes.io/component: zone-gateway
    security.poc.example/zone: zone-a
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: https-mtls, port: 8443, targetPort: mtls }
