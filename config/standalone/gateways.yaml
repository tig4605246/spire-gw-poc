apiVersion: v1
kind: ServiceAccount
metadata:
  name: zone-gateway
  namespace: zone-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-gateway
  namespace: zone-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: zone-gateway
      security.poc.example/zone: zone-a
  template:
    metadata:
      labels:
        app.kubernetes.io/component: zone-gateway
        app.kubernetes.io/name: zone-gateway
        security.poc.example/zone: zone-a
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: zone-gateway
      nodeSelector:
        security.poc.example/gateway-zone: zone-a
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.1
          args: ["-c", "/etc/envoy/envoy.yaml", "--concurrency", "2", "--log-level", "info"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mtls, containerPort: 8443 }
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
            - { name: workload-socket, mountPath: /run/secrets/workload-spiffe-uds, readOnly: true }
          readinessProbe:
            tcpSocket: { port: mtls }
      volumes:
        - name: config
          configMap: { name: zone-a-envoy-bootstrap }
        - name: workload-socket
          csi: { driver: csi.spiffe.io, readOnly: true }
---
apiVersion: v1
kind: Service
metadata:
  name: zone-gateway
  namespace: zone-a
spec:
  selector:
    app.kubernetes.io/component: zone-gateway
    security.poc.example/zone: zone-a
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: mtls, port: 8443, targetPort: mtls }
