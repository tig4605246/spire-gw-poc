apiVersion: v1
kind: ConfigMap
metadata:
  name: zone-gateway-options
  namespace: zone-a
data:
  service: |
    spec:
      type: ClusterIP
  deployment: |
    spec:
      replicas: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: zone-gateway
            app.kubernetes.io/name: zone-gateway
            security.poc.example/zone: zone-a
            spiffe.io/spire-managed-identity: "true"
            gateway.networking.k8s.io/gateway-name: zone-gateway
        spec:
          nodeSelector:
            security.poc.example/gateway-zone: zone-a
          initContainers:
            - name: wait-for-spire-socket
              image: curlimages/curl:8.17.0
              command: [sh, -ec, 'until test -S /run/secrets/workload-spiffe-uds/socket; do sleep 1; done']
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 32Mi }
              volumeMounts:
                - name: workload-socket
                  mountPath: /run/secrets/workload-spiffe-uds
                  readOnly: true
          volumes:
            - name: workload-socket
              $patch: replace
              csi:
                driver: csi.spiffe.io
                readOnly: true
          containers:
            - name: istio-proxy
              ports:
                - { name: http, containerPort: 8080 }
                - { name: mtls, containerPort: 8443 }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
              volumeMounts:
                # Volume mounts merge by mountPath, unlike volumes (name).
                - mountPath: /var/run/secrets/workload-spiffe-uds
                  $patch: delete
                - name: workload-socket
                  mountPath: /run/secrets/workload-spiffe-uds
                  readOnly: true
