apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: call-remote-zone
  namespace: zone-a
spec:
  parentRefs:
    - name: zone-gateway
      sectionName: http-call-entry
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /call/zone-b
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-spiffe-peer-id, x-source-zone, x-destination-zone]
      backendRefs:
        - name: zone-gateway-istio
          namespace: zone-b
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: protected-local-app
  namespace: zone-a
spec:
  parentRefs:
    - name: zone-gateway
      sectionName: https-protected
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [x-spiffe-peer-id, x-source-zone, x-destination-zone]
      backendRefs:
        - name: zone-app
          port: 8080
---
