name: POC checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install YAML checker
        run: pip install PyYAML==6.0.2
      - name: Unit, race, vet, manifests and Envoy schema
        run: make test
      - name: Generated API artifacts are reproducible
        run: |
          ./scripts/generate-api.sh
          git diff --exit-code -- api/ config/crd/
      - uses: docker/setup-buildx-action@v3
      - name: Build both architectures
        run: |
          source versions.env
          for command in zone-trust-controller echo-app; do
            docker buildx build --platform linux/amd64,linux/arm64 \
              --build-arg GO_VERSION="$GO_VERSION" --build-arg BASE_IMAGE="$DISTROLESS_IMAGE" \
              --build-arg COMMAND="$command" .
          done
  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, istio, istio-gateway-api]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pip install PyYAML==6.0.2
      - run: make tools
      - run: make bootstrap
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.mode }}
          path: .state/${{ matrix.mode }}/evidence/
      - run: make destroy
        if: always()
